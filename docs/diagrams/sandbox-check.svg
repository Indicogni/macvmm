<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 430" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>How a sandbox check happens</title>
<desc>A process opens /etc/hosts. The system call reaches XNU, which looks up the path. A MAC hook asks Sandbox.kext, which evaluates the profile. If it allows, the file descriptor is returned. If it denies, the process gets EPERM and the kernel logs a line from Sandbox.</desc>
<defs><marker id="sandbox-check-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<path class="dg-edge" d="M235 68.2L235 130.9" fill="none" stroke="currentColor" marker-end="url(#sandbox-check-arrow)"/><path class="dg-edge" d="M235 169.1L235 226.8" fill="none" stroke="currentColor" marker-end="url(#sandbox-check-arrow)"/><path class="dg-edge" d="M175 283.2L175 320L110 320L110 365.9" fill="none" stroke="currentColor" marker-end="url(#sandbox-check-arrow)"/><path class="dg-edge" d="M295 283.2L295 320L360 320L360 356.8" fill="none" stroke="currentColor" marker-end="url(#sandbox-check-arrow)"/><rect class="dg-node" x="125" y="11.8" width="220" height="56.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="235" y="35.8" font-size="14" text-anchor="middle" fill="currentColor">process</text><text class="dg-text" x="235" y="54" font-size="14" text-anchor="middle" fill="currentColor">open /etc/hosts</text><rect class="dg-node" x="125" y="130.9" width="220" height="38.2" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="235" y="154.9" font-size="14" text-anchor="middle" fill="currentColor">XNU: path lookup</text><rect class="dg-node" x="125" y="226.8" width="220" height="56.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="235" y="250.8" font-size="14" text-anchor="middle" fill="currentColor">Sandbox.kext</text><text class="dg-text" x="235" y="269" font-size="14" text-anchor="middle" fill="currentColor">evaluates profile</text><rect class="dg-node dg-end" x="25" y="365.9" width="170" height="38.2" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="110" y="389.9" font-size="14" text-anchor="middle" fill="currentColor">fd returned</text><rect class="dg-node dg-end" x="265" y="356.8" width="190" height="56.4" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="360" y="380.8" font-size="14" text-anchor="middle" fill="currentColor">EPERM + log line</text><text class="dg-text" x="360" y="399" font-size="14" text-anchor="middle" fill="currentColor">(kernel, Sandbox)</text><rect class="dg-label-bg" x="241" y="89.1" width="90.1" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="246" y="104.1" font-size="13" text-anchor="start" fill="currentColor">system call</text><rect class="dg-label-bg" x="241" y="187.5" width="104.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="246" y="202.5" font-size="13" text-anchor="start" fill="currentColor">MAC hook asks</text><rect class="dg-label-bg" x="119.3" y="297.6" width="46.4" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="142.5" y="312.6" font-size="13" text-anchor="middle" fill="currentColor">allow</text><rect class="dg-label-bg" x="307.9" y="297.6" width="39.1" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="327.5" y="312.6" font-size="13" text-anchor="middle" fill="currentColor">deny</text>
</svg>
