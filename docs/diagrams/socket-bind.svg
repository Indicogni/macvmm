<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>Binding a Unix socket path safely</title>
<desc>Step 1: lstat the path, without following symlinks. If nothing is there, bind. If something is there, step 2: is it a socket file? If not (a symlink, a regular file or anything else), refuse and exit 2. If yes, step 3: is it owned by our uid? If not, refuse and exit 2. If yes, step 4: a test connect. ECONNREFUSED means the socket is stale: unlink it, then bind. If the connection is accepted the socket is live, and any other error, both refuse and exit 2.</desc>
<defs><marker id="socket-bind-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<path class="dg-edge" d="M300 40L405 40" fill="none" stroke="currentColor" marker-end="url(#socket-bind-arrow)"/><path class="dg-edge" d="M180 68.2L180 150.9" fill="none" stroke="currentColor" marker-end="url(#socket-bind-arrow)"/><path class="dg-edge" d="M300 170L480 170L480 280.9" fill="none" stroke="currentColor" marker-end="url(#socket-bind-arrow)"/><path class="dg-edge" d="M180 189.1L180 280.9" fill="none" stroke="currentColor" marker-end="url(#socket-bind-arrow)"/><path class="dg-edge" d="M300 300L405 300" fill="none" stroke="currentColor" marker-end="url(#socket-bind-arrow)"/><path class="dg-edge" d="M180 319.1L180 410.9" fill="none" stroke="currentColor" marker-end="url(#socket-bind-arrow)"/><path class="dg-edge" d="M300 430L480 430L480 319.1" fill="none" stroke="currentColor" marker-end="url(#socket-bind-arrow)"/><path class="dg-edge" d="M180 449.1L180 570.9" fill="none" stroke="currentColor" marker-end="url(#socket-bind-arrow)"/><rect class="dg-node" x="60" y="11.8" width="240" height="56.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="180" y="35.8" font-size="14" text-anchor="middle" fill="currentColor">1. lstat the path</text><text class="dg-text" x="180" y="54" font-size="14" text-anchor="middle" fill="currentColor">(do not follow symlinks)</text><rect class="dg-node dg-end" x="405" y="20.9" width="150" height="38.2" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="480" y="44.9" font-size="14" text-anchor="middle" fill="currentColor">bind</text><path class="dg-node dg-decision" d="M60 170L72 150.9H288L300 170L288 189.1H72Z" fill="none" stroke="currentColor"/><text class="dg-text" x="180" y="174.9" font-size="14" text-anchor="middle" fill="currentColor">2. is it a socket file?</text><path class="dg-node dg-decision" d="M60 300L72 280.9H288L300 300L288 319.1H72Z" fill="none" stroke="currentColor"/><text class="dg-text" x="180" y="304.9" font-size="14" text-anchor="middle" fill="currentColor">3. owned by our uid?</text><path class="dg-node dg-decision" d="M60 430L72 410.9H288L300 430L288 449.1H72Z" fill="none" stroke="currentColor"/><text class="dg-text" x="180" y="434.9" font-size="14" text-anchor="middle" fill="currentColor">4. test connect</text><rect class="dg-node dg-end" x="405" y="280.9" width="150" height="38.2" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="480" y="304.9" font-size="14" text-anchor="middle" fill="currentColor">refuse, exit 2</text><rect class="dg-node dg-end" x="60" y="570.9" width="240" height="38.2" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="180" y="594.9" font-size="14" text-anchor="middle" fill="currentColor">unlink, then bind</text><rect class="dg-label-bg" x="300.2" y="13.6" width="104.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="352.5" y="28.6" font-size="13" text-anchor="middle" fill="currentColor">nothing there</text><rect class="dg-label-bg" x="186" y="99.1" width="119.2" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="114.1" font-size="13" text-anchor="start" fill="currentColor">something there</text><rect class="dg-label-bg" x="312.2" y="133.1" width="155.6" height="37.8" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="390" y="148.1" font-size="13" text-anchor="middle" fill="currentColor">no: symlink, regular</text><text class="dg-text dg-label" x="390" y="165" font-size="13" text-anchor="middle" fill="currentColor">file, other</text><rect class="dg-label-bg" x="186" y="224.6" width="31.8" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="239.6" font-size="13" text-anchor="start" fill="currentColor">yes</text><rect class="dg-label-bg" x="340.2" y="277.6" width="24.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="352.5" y="292.6" font-size="13" text-anchor="middle" fill="currentColor">no</text><rect class="dg-label-bg" x="186" y="354.6" width="31.8" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="369.6" font-size="13" text-anchor="start" fill="currentColor">yes</text><rect class="dg-label-bg" x="319.5" y="433.1" width="141" height="37.8" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="390" y="448.1" font-size="13" text-anchor="middle" fill="currentColor">accepted: live, or</text><text class="dg-text dg-label" x="390" y="465" font-size="13" text-anchor="middle" fill="currentColor">any other error</text><rect class="dg-label-bg" x="186" y="499.6" width="148.3" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="514.6" font-size="13" text-anchor="start" fill="currentColor">ECONNREFUSED: stale</text>
</svg>
