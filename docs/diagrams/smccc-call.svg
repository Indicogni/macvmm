<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 602 486" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>One SMCCC call through HVF</title>
<desc>Sequence between the guest kernel (EL1, untrusted), HVF (EL2) and macvmm (a host process). 1. The guest puts the function ID in w0 and arguments in x1 onwards. 2. The guest executes hvc #0, an exception to EL2. 3. HVF makes hv_vcpu_run return to macvmm, with ESR_EL2 exception class 0x16 (HVC). 4. macvmm reads x0 to x3, decodes the ID and acts. 5. macvmm writes the result into x0 and calls hv_vcpu_run again. 6. The guest resumes after the hvc and reads x0.</desc>
<defs><marker id="smccc-call-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect class="dg-node" x="24" y="14" width="174" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="111" y="37" font-size="14" text-anchor="middle" fill="currentColor">Guest kernel (EL1,</text><text class="dg-text" x="111" y="55.2" font-size="14" text-anchor="middle" fill="currentColor">untrusted)</text><line class="dg-life" x1="111" y1="68.4" x2="111" y2="481" stroke="currentColor" stroke-dasharray="3 4"/><rect class="dg-node" x="214" y="14" width="174" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="301" y="46.1" font-size="14" text-anchor="middle" fill="currentColor">HVF (EL2)</text><line class="dg-life" x1="301" y1="68.4" x2="301" y2="481" stroke="currentColor" stroke-dasharray="3 4"/><rect class="dg-node" x="404" y="14" width="174" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="491" y="46.1" font-size="14" text-anchor="middle" fill="currentColor">macvmm (host process)</text><line class="dg-life" x1="491" y1="68.4" x2="491" y2="481" stroke="currentColor" stroke-dasharray="3 4"/><path class="dg-edge" d="M111 86.4h22v50.7h-20" fill="none" stroke="currentColor" marker-end="url(#smccc-call-arrow)"/><text class="dg-text" x="141" y="99.4" font-size="13" text-anchor="start" fill="currentColor">put function ID in</text><text class="dg-text" x="141" y="116.3" font-size="13" text-anchor="start" fill="currentColor">w0, arguments in</text><text class="dg-text" x="141" y="133.2" font-size="13" text-anchor="start" fill="currentColor">x1..</text><text class="dg-text" x="206" y="172.1" font-size="13" text-anchor="middle" fill="currentColor">executes hvc #0</text><text class="dg-text" x="206" y="189" font-size="13" text-anchor="middle" fill="currentColor">(exception to EL2)</text><line class="dg-edge" x1="111" y1="198.9" x2="299" y2="198.9" stroke="currentColor" marker-end="url(#smccc-call-arrow)"/><text class="dg-text" x="396" y="233.9" font-size="13" text-anchor="middle" fill="currentColor">hv_vcpu_run returns,</text><text class="dg-text" x="396" y="250.8" font-size="13" text-anchor="middle" fill="currentColor">ESR_EL2 class 0x16</text><text class="dg-text" x="396" y="267.7" font-size="13" text-anchor="middle" fill="currentColor">(HVC)</text><line class="dg-edge" x1="301" y1="277.6" x2="489" y2="277.6" stroke="currentColor" marker-end="url(#smccc-call-arrow)"/><path class="dg-edge" d="M491 299.6h-22v33.8h20" fill="none" stroke="currentColor" marker-end="url(#smccc-call-arrow)"/><text class="dg-text" x="461" y="312.6" font-size="13" text-anchor="end" fill="currentColor">reads x0..x3,</text><text class="dg-text" x="461" y="329.5" font-size="13" text-anchor="end" fill="currentColor">decodes the ID, acts</text><text class="dg-text" x="396" y="368.4" font-size="13" text-anchor="middle" fill="currentColor">writes the result into</text><text class="dg-text" x="396" y="385.3" font-size="13" text-anchor="middle" fill="currentColor">x0, calls hv_vcpu_run</text><line class="dg-edge" x1="491" y1="395.2" x2="303" y2="395.2" stroke="currentColor" marker-end="url(#smccc-call-arrow)"/><text class="dg-text" x="206" y="430.2" font-size="13" text-anchor="middle" fill="currentColor">guest resumes after the</text><text class="dg-text" x="206" y="447.1" font-size="13" text-anchor="middle" fill="currentColor">hvc, reads x0</text><line class="dg-edge" x1="301" y1="457" x2="113" y2="457" stroke="currentColor" marker-end="url(#smccc-call-arrow)"/>
</svg>
