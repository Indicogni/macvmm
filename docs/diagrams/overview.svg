<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 812" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>The whole picture</title>
<desc>Four layers, top to bottom. 1. The guest: Linux, U-Boot then FreeBSD, or a test guest. It believes it runs on a QEMU virt board. 2. The macvmm process, one macOS process that sandboxes itself. It holds the command line (crates/macvmm), the VMM library (crates/vmm: vCPU threads, devices, virtio, loaders and the device tree) and the FFI bindings (crates/hvf). Beside it, on the host, are the input files (kernel, initramfs, disk image), which macvmm reads, and the terminal, which carries the serial console both ways. 3. Hypervisor.framework and the macOS kernel, called through the FFI bindings: the stage-2 memory map, vCPUs, the in-kernel GIC interrupt controller and the virtual timer. 4. The Apple Silicon CPU, which runs the guest's instructions directly, at full speed.</desc>
<defs><marker id="overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect class="dg-group" x="8" y="122" width="320" height="292" rx="10" fill="none" stroke="currentColor"/><text class="dg-text dg-group-label" x="20" y="144" font-size="14" text-anchor="start" fill="currentColor">macvmm: one macOS process, sandboxed</text><rect class="dg-group" x="8" y="562" width="320" height="144" rx="10" fill="none" stroke="currentColor"/><text class="dg-text dg-group-label" x="20" y="584" font-size="14" text-anchor="start" fill="currentColor">Hypervisor.framework + macOS kernel</text><path class="dg-edge" d="M72 440L72 414" fill="none" stroke="currentColor" marker-end="url(#overview-arrow)"/><path class="dg-edge" d="M248 440L248 414" fill="none" stroke="currentColor" marker-end="url(#overview-arrow)"/><path class="dg-edge" d="M280 414L280 440" fill="none" stroke="currentColor" marker-end="url(#overview-arrow)"/><path class="dg-edge" d="M168 399.9L168 562" fill="none" stroke="currentColor" marker-end="url(#overview-arrow)"/><rect class="dg-node dg-accent" x="8" y="8" width="320" height="98.1" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="168" y="33" font-size="15" text-anchor="middle" fill="currentColor">The guest</text><text class="dg-text dg-label" x="168" y="55.5" font-size="14" text-anchor="middle" fill="currentColor">Linux, U-Boot then FreeBSD, or a test</text><text class="dg-text dg-label" x="168" y="73.7" font-size="14" text-anchor="middle" fill="currentColor">guest. It believes it runs on a QEMU</text><text class="dg-text dg-label" x="168" y="91.9" font-size="14" text-anchor="middle" fill="currentColor">virt board.</text><rect class="dg-node" x="20" y="158.2" width="296" height="61.7" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="168" y="183.2" font-size="15" text-anchor="middle" fill="currentColor">Command line</text><text class="dg-text dg-label" x="168" y="205.7" font-size="14" text-anchor="middle" fill="currentColor">crates/macvmm</text><rect class="dg-node" x="20" y="230" width="296" height="98.1" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="168" y="255" font-size="15" text-anchor="middle" fill="currentColor">VMM library</text><text class="dg-text dg-label" x="168" y="277.5" font-size="14" text-anchor="middle" fill="currentColor">crates/vmm</text><text class="dg-text dg-label" x="168" y="295.7" font-size="14" text-anchor="middle" fill="currentColor">vCPU threads, devices, virtio,</text><text class="dg-text dg-label" x="168" y="313.8" font-size="14" text-anchor="middle" fill="currentColor">loaders and the device tree</text><rect class="dg-node" x="68" y="338.2" width="200" height="61.7" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="168" y="363.2" font-size="15" text-anchor="middle" fill="currentColor">FFI bindings</text><text class="dg-text dg-label" x="168" y="385.7" font-size="14" text-anchor="middle" fill="currentColor">crates/hvf</text><rect class="dg-node dg-muted" x="8" y="440" width="128" height="98" rx="6" fill="none" stroke="currentColor" stroke-dasharray="5 4"/><text class="dg-text" x="72" y="465" font-size="15" text-anchor="middle" fill="currentColor">Host files</text><text class="dg-text dg-label" x="72" y="487.4" font-size="14" text-anchor="middle" fill="currentColor">kernel,</text><text class="dg-text dg-label" x="72" y="505.6" font-size="14" text-anchor="middle" fill="currentColor">initramfs,</text><text class="dg-text dg-label" x="72" y="523.8" font-size="14" text-anchor="middle" fill="currentColor">disk image</text><rect class="dg-node dg-muted" x="200" y="440" width="128" height="98" rx="6" fill="none" stroke="currentColor" stroke-dasharray="5 4"/><text class="dg-text" x="264" y="474.1" font-size="15" text-anchor="middle" fill="currentColor">Terminal</text><text class="dg-text dg-label" x="264" y="496.6" font-size="14" text-anchor="middle" fill="currentColor">the serial</text><text class="dg-text dg-label" x="264" y="514.8" font-size="14" text-anchor="middle" fill="currentColor">console</text><rect class="dg-node" x="20" y="594" width="142" height="44" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="91" y="621.3" font-size="15" text-anchor="middle" fill="currentColor">Stage-2 memory</text><rect class="dg-node" x="174" y="594" width="142" height="44" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="245" y="621.3" font-size="15" text-anchor="middle" fill="currentColor">vCPUs</text><rect class="dg-node" x="20" y="648" width="142" height="44" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="91" y="675.3" font-size="15" text-anchor="middle" fill="currentColor">In-kernel GIC</text><rect class="dg-node" x="174" y="648" width="142" height="44" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="245" y="675.3" font-size="15" text-anchor="middle" fill="currentColor">Virtual timer</text><rect class="dg-node dg-accent" x="8" y="722.1" width="320" height="79.9" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="168" y="747.1" font-size="15" text-anchor="middle" fill="currentColor">Apple Silicon CPU</text><text class="dg-text dg-label" x="168" y="769.6" font-size="14" text-anchor="middle" fill="currentColor">runs the guest's instructions</text><text class="dg-text dg-label" x="168" y="787.8" font-size="14" text-anchor="middle" fill="currentColor">directly, at full speed</text>
</svg>
