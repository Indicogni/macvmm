ext><text class="dg-text" x="290" y="140" font-size="14" text-anchor="middle" fill="currentColor">device</text><path class="dg-node dg-decision" d="M140 226L152 197.8H428L440 226L428 254.2H152Z" fill="none" stroke="currentColor"/><text class="dg-text" x="290" y="221.8" font-size="14" text-anchor="middle" fill="currentColor">'arm,primecell-periphid' property</text><text class="dg-text" x="290" y="240" font-size="14" text-anchor="middle" fill="currentColor">in the node?</text><path class="dg-node dg-decision" d="M180 336L192 316.9H388L400 336L388 355.1H192Z" fill="none" stroke="currentColor"/><text class="dg-text" x="290" y="340.9" font-size="14" text-anchor="middle" fill="currentColor">enable apb_pclk</text><rect class="dg-node dg-end" x="455" y="371.8" width="170" height="56.4" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="540" y="395.8" font-size="14" text-anchor="middle" fill="currentColor">defer: try again</text><text class="dg-text" x="540" y="414" font-size="14" text-anchor="middle" fill="currentColor">later, forever</text><rect class="dg-node" x="150" y="417.8" width="280" height="56.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="290" y="441.8" font-size="14" text-anchor="middle" fill="currentColor">read last 0x20 bytes of the</text><text class="dg-text" x="290" y="460" font-size="14" text-anchor="middle" fill="currentColor">window</text><path class="dg-node dg-decision" d="M160 546L172 526.9H408L420 546L408 565.1H172Z" fill="none" stroke="currentColor"/><text class="dg-text" x="290" y="550.9" font-size="14" text-anchor="middle" fill="currentColor">cell ID is 0xB105F00D?</text><path class="dg-node dg-decision" d="M140 676L152 647.8H428L440 676L428 704.2H152Z" fill="none" stroke="currentColor"/><text class="dg-text" x="290" y="671.8" font-size="14" text-anchor="middle" fill="currentColor">(ID &amp; mask) == id for a driver's</text><text class="dg-text" x="290" y="690" font-size="14" text-anchor="middle" fill="currentColor">table entry?</text><path class="dg-node dg-decision" d="M160 806L172 786.9H408L420 806L408 825.1H172Z" fill="none" stroke="currentColor"/><text class="dg-text" x="290" y="810.9" font-size="14" text-anchor="middle" fill="currentColor">probe: enable apb_pclk again</text><rect class="dg-node dg-end" x="455" y="851.8" width="170" height="56.4" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="540" y="875.8" font-size="14" text-anchor="middle" fill="currentColor">probe fails, not</text><text class="dg-text" x="540" y="894" font-size="14" text-anchor="middle" fill="currentColor">bound</text><rect class="dg-node dg-end" x="180" y="940.9" width="220" height="38.2" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="290" y="964.9" font-size="14" text-anchor="middle" fill="currentColor">the driver binds</text><rect class="dg-label-bg" x="296" y="66" width="61" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="301" y="81" font-size="13" text-anchor="start" fill="currentColor">creates</text><rect class="dg-label-bg" x="296" y="165.6" width="53.7" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="301" y="180.6" font-size="13" text-anchor="start" fill="currentColor">checks</text><rect class="dg-label-bg" x="42" y="342.1" width="90.1" height="37.8" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="47" y="357.1" font-size="13" text-anchor="start" fill="currentColor">yes: use it</text><text class="dg-text dg-label" x="47" y="374" font-size="13" text-anchor="start" fill="currentColor">as the ID</text><rect class="dg-label-bg" x="296" y="275.1" width="24.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="301" y="290.1" font-size="13" text-anchor="start" fill="currentColor">no</text><rect class="dg-label-bg" x="417.7" y="312.6" width="104.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="470" y="327.6" font-size="13" text-anchor="middle" fill="currentColor">no such clock</text><rect class="dg-label-bg" x="296" y="376" width="24.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="301" y="391" font-size="13" text-anchor="start" fill="currentColor">ok</text><rect class="dg-label-bg" x="467.7" y="523.6" width="24.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="480" y="538.6" font-size="13" text-anchor="middle" fill="currentColor">no</text><rect class="dg-label-bg" x="296" y="587.6" width="162.9" height="37.8" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="301" y="602.6" font-size="13" text-anchor="start" fill="currentColor">yes: store peripheral</text><text class="dg-text dg-label" x="301" y="619.5" font-size="13" text-anchor="start" fill="currentColor">ID</text><rect class="dg-label-bg" x="296" y="735.1" width="31.8" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="301" y="750.1" font-size="13" text-anchor="start" fill="currentColor">yes</text><rect class="dg-label-bg" x="427.7" y="782.6" width="104.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="480" y="797.6" font-size="13" text-anchor="middle" fill="currentColor">no such clock</text><rect class="dg-label-bg" x="296" y="872.6" width="24.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="301" y="887.6" font-size="13" text-anchor="start" fill="currentColor">ok</text>
