<svg width="640" height="1010" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>How Linux binds a PrimeCell device</title>
<desc>A device-tree node lists 'arm,primecell', which creates an AMBA device, not a platform device. Linux checks whether the node has an 'arm,primecell-periphid' property. If yes, it uses that as the ID and goes to matching. If no, it enables the apb_pclk clock: if there is no such clock it defers and tries again later, forever; if that works it reads the last 0x20 bytes of the register window. If the cell ID is not 0xB105F00D it defers, forever. If it is, it stores the peripheral ID and goes to matching. Matching asks whether (ID AND mask) equals id for a driver's table entry. If yes, probe enables apb_pclk again: with no such clock the probe fails and the device is not bound; if that works the driver binds.</desc>
