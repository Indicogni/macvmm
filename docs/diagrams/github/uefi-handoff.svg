<svg width="602" height="437" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 602 437" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>UEFI firmware, an EFI application and the OS</title>
<desc>Sequence between UEFI firmware, an EFI application (the Linux stub or loader.efi) and the OS kernel. 1. Firmware calls StartImage: x0 is the image handle, x1 the System Table. 2. The application uses boot services: allocate memory, read files, print, GetMemoryMap. 3. The application calls ExitBootServices with its handle and the MapKey. 4. The application jumps to the kernel entry. 5. From then on the OS uses only runtime services: GetTime, SetVariable, ResetSystem.</desc>
