"457.8" width="260" height="56.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="180" y="481.8" font-size="14" text-anchor="middle" fill="currentColor">pty replica end, /dev/ttys001</text><text class="dg-text" x="180" y="500" font-size="14" text-anchor="middle" fill="currentColor">held by the shell</text><rect class="dg-node" x="60" y="580.9" width="240" height="38.2" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="180" y="604.9" font-size="14" text-anchor="middle" fill="currentColor">shell, sleep, macvmm</text><rect class="dg-label-bg" x="186" y="75.6" width="82.8" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="90.6" font-size="13" text-anchor="start" fill="currentColor">keystrokes</text><rect class="dg-label-bg" x="186" y="176" width="97.4" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="191" font-size="13" text-anchor="start" fill="currentColor">writes bytes</text><rect class="dg-label-bg" x="186" y="295.6" width="111.9" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="310.6" font-size="13" text-anchor="start" fill="currentColor">passes through</text><rect class="dg-label-bg" x="186" y="415.6" width="68.2" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="430.6" font-size="13" text-anchor="start" fill="currentColor">delivers</text><rect class="dg-label-bg" x="186" y="537.1" width="61" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="191" y="552.1" font-size="13" text-anchor="start" fill="currentColor">read by</text><rect class="dg-label-bg" x="404" y="477.6" width="97.4" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="409" y="492.6" font-size="13" text-anchor="start" fill="currentColor">output bytes</text><rect class="dg-label-bg" x="397.8" y="227.1" width="68.2" height="37.8" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="461" y="242.1" font-size="13" text-anchor="end" fill="currentColor">draws on</text><text class="dg-text dg-label" x="461" y="259" font-size="13" text-anchor="end" fill="currentColor">screen</text>
</svg>
