<svg width="632" height="447" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 447" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>The self-pipe pattern</title>
<desc>Sequence between the kernel, a signal handler running on any thread, a pipe, and a dedicated signal thread. 1. The kernel interrupts a thread and runs the handler. 2. The handler writes one byte, the signal number, to the pipe. 3. The handler returns to the kernel and the interrupted code resumes. 4. On the signal thread, read() returns the byte. 5. The signal thread does the real work: locks, I/O, exit.</desc>
