<rect class="dg-node" x="24" y="14" width="134" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="91" y="46.1" font-size="14" text-anchor="middle" fill="currentColor">Kernel</text><line class="dg-life" x1="91" y1="68.4" x2="91" y2="442.1" stroke="currentColor" stroke-dasharray="3 4"/><rect class="dg-node" x="174" y="14" width="134" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="241" y="37" font-size="14" text-anchor="middle" fill="currentColor">Handler (any</text><text class="dg-text" x="241" y="55.2" font-size="14" text-anchor="middle" fill="currentColor">thread)</text><line class="dg-life" x1="241" y1="68.4" x2="241" y2="442.1" stroke="currentColor" stroke-dasharray="3 4"/><rect class="dg-node" x="324" y="14" width="134" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="391" y="46.1" font-size="14" text-anchor="middle" fill="currentColor">Pipe</text><line class="dg-life" x1="391" y1="68.4" x2="391" y2="442.1" stroke="currentColor" stroke-dasharray="3 4"/><rect class="dg-node" x="474" y="14" width="134" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="541" y="46.1" font-size="14" text-anchor="middle" fill="currentColor">Signal thread</text><line class="dg-life" x1="541" y1="68.4" x2="541" y2="442.1" stroke="currentColor" stroke-dasharray="3 4"/><text class="dg-text" x="166" y="99.4" font-size="13" text-anchor="middle" fill="currentColor">interrupts a</text><text class="dg-text" x="166" y="116.3" font-size="13" text-anchor="middle" fill="currentColor">thread, runs</text><text class="dg-text" x="166" y="133.2" font-size="13" text-anchor="middle" fill="currentColor">handler</text><line class="dg-edge" x1="91" y1="143.1" x2="239" y2="143.1" stroke="currentColor" marker-end="url(#self-pipe-arrow)"/><text class="dg-text" x="316" y="178.1" font-size="13" text-anchor="middle" fill="currentColor">write(1 byte =</text><text class="dg-text" x="316" y="195" font-size="13" text-anchor="middle" fill="currentColor">signal number)</text><line class="dg-edge" x1="241" y1="204.9" x2="389" y2="204.9" stroke="currentColor" marker-end="url(#self-pipe-arrow)"/><text class="dg-text" x="166" y="239.9" font-size="13" text-anchor="middle" fill="currentColor">returns;</text><text class="dg-text" x="166" y="256.8" font-size="13" text-anchor="middle" fill="currentColor">interrupted code</text><text class="dg-text" x="166" y="273.7" font-size="13" text-anchor="middle" fill="currentColor">resumes</text><line class="dg-edge dg-dashed" x1="241" y1="283.6" x2="93" y2="283.6" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#self-pipe-arrow)"/><text class="dg-text" x="466" y="318.6" font-size="13" text-anchor="middle" fill="currentColor">read() returns</text><text class="dg-text" x="466" y="335.5" font-size="13" text-anchor="middle" fill="currentColor">the byte</text><line class="dg-edge" x1="391" y1="345.4" x2="539" y2="345.4" stroke="currentColor" marker-end="url(#self-pipe-arrow)"/><path class="dg-edge" d="M541 367.4h-22v50.7h20" fill="none" stroke="currentColor" marker-end="url(#self-pipe-arrow)"/><text class="dg-text" x="511" y="380.4" font-size="13" text-anchor="end" fill="currentColor">does the real</text><text class="dg-text" x="511" y="397.3" font-size="13" text-anchor="end" fill="currentColor">work (locks,</text><text class="dg-text" x="511" y="414.2" font-size="13" text-anchor="end" fill="currentColor">I/O, exit)</text>
