<path class="dg-edge" d="M170 59.1L170 106.8" fill="none" stroke="currentColor" marker-end="url(#linux-boot-stages-arrow)"/><path class="dg-edge" d="M170 163.2L170 215.9" fill="none" stroke="currentColor" marker-end="url(#linux-boot-stages-arrow)"/><path class="dg-edge" d="M170 254.1L170 310.9" fill="none" stroke="currentColor" marker-end="url(#linux-boot-stages-arrow)"/><path class="dg-edge" d="M170 349.1L170 401.8" fill="none" stroke="currentColor" marker-end="url(#linux-boot-stages-arrow)"/><path class="dg-edge" d="M170 458.2L170 505.9" fill="none" stroke="currentColor" marker-end="url(#linux-boot-stages-arrow)"/><path class="dg-edge" d="M170 544.1L170 595.9" fill="none" stroke="currentColor" marker-end="url(#linux-boot-stages-arrow)"/><path class="dg-edge" d="M170 634.1L170 695.9" fill="none" stroke="currentColor" marker-end="url(#linux-boot-stages-arrow)"/><rect class="dg-node" x="20" y="20.9" width="300" height="38.2" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="170" y="44.9" font-size="14" text-anchor="middle" fill="currentColor">1. head.S: MMU on, jump to C</text><rect class="dg-node" x="20" y="106.8" width="300" height="56.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="170" y="130.8" font-size="14" text-anchor="middle" fill="currentColor">2. start_kernel: banner, first DT</text><text class="dg-text" x="170" y="149" font-size="14" text-anchor="middle" fill="currentColor">read, command line</text><rect class="dg-node" x="20" y="215.9" width="300" height="38.2" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="170" y="239.9" font-size="14" text-anchor="middle" fill="currentColor">3. interrupt controller (GIC)</text><rect class="dg-node" x="20" y="310.9" width="300" height="38.2" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="170" y="334.9" font-size="14" text-anchor="middle" fill="currentColor">4. timer, clocksource, delay loop</text><rect class="dg-node" x="20" y="401.8" width="300" height="56.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="170" y="425.8" font-size="14" text-anchor="middle" fill="currentColor">5. kernel_init: other CPUs,</text><text class="dg-text" x="170" y="444" font-size="14" text-anchor="middle" fill="currentColor">initcalls</text><rect class="dg-node" x="20" y="505.9" width="300" height="38.2" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="170" y="529.9" font-size="14" text-anchor="middle" fill="currentColor">6. drivers bind to DT nodes</text><rect class="dg-node" x="20" y="595.9" width="300" height="38.2" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="170" y="619.9" font-size="14" text-anchor="middle" fill="currentColor">7. initramfs unpacked</text><rect class="dg-node" x="20" y="695.9" width="300" height="38.2" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="170" y="719.9" font-size="14" text-anchor="middle" fill="currentColor">8. /init in user space</text><rect class="dg-label-bg" x="176" y="179.1" width="68.2" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="181" y="194.1" font-size="13" text-anchor="start" fill="currentColor">init_IRQ</text><rect class="dg-label-bg" x="176" y="272.1" width="75.5" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="181" y="287.1" font-size="13" text-anchor="start" fill="currentColor">time_init</text><rect class="dg-label-bg" x="176" y="365" width="104.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="181" y="380" font-size="13" text-anchor="start" fill="currentColor">creates PID 1</text><rect class="dg-label-bg" x="176" y="654.6" width="39.1" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="181" y="669.6" font-size="13" text-anchor="start" fill="currentColor">exec</text>
</svg>
