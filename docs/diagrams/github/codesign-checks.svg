.dg .dg-note{fill: #F6E9DC; stroke: #A33F00;}
.dg .dg-edge{stroke: #5B616B; stroke-width: 1.5; fill: none;}
.dg .dg-life{stroke: #5B616B; stroke-width: 1;}
.dg .dg-arrow{fill: #5B616B;}
.dg .dg-text{fill: #1E2227;}
.dg .dg-label{fill: #5B616B;}
.dg .dg-label-bg{fill: #FFFDF8;}
.dg .dg-accent{fill: #F6E9DC; stroke: #A33F00; stroke-width: 1.75;}
.dg .dg-muted{fill: none; stroke: #5B616B; stroke-dasharray: 5 4;}
.dg .dg-group{fill: #F3EEE2; stroke: #E4DDCC;}
.dg .dg-group-label{fill: #A33F00; font-weight: 600;}
.dg .dg-mono{font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.dg .dg-bg{fill: #FFFDF8}
@media (prefers-color-scheme: dark) {
