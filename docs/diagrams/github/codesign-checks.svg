.dg .dg-end{fill: #0B0E13;}
.dg .dg-note{fill: #231A14; stroke: #F0A15E;}
.dg .dg-edge{stroke: #9AA0A8; stroke-width: 1.5; fill: none;}
.dg .dg-life{stroke: #9AA0A8; stroke-width: 1;}
.dg .dg-arrow{fill: #9AA0A8;}
.dg .dg-text{fill: #E7E2D7;}
.dg .dg-label{fill: #9AA0A8;}
.dg .dg-label-bg{fill: #141820;}
.dg .dg-accent{fill: #231A14; stroke: #F0A15E; stroke-width: 1.75;}
.dg .dg-muted{fill: none; stroke: #9AA0A8; stroke-dasharray: 5 4;}
.dg .dg-group{fill: #0B0E13; stroke: #262B33;}
.dg .dg-group-label{fill: #F0A15E; font-weight: 600;}
.dg .dg-mono{font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.dg .dg-bg{fill: #141820}
}
