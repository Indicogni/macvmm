<svg width="336" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 640" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>The board the guest sees</title>
<desc>The guest-physical address map of macvmm's virt board, lowest address at the top, not to scale. 0x0000_0000: flash, for firmware, mapped only with --bios. 0x0800_0000: the GIC interrupt controller's distributor, then its redistributors from 0x080A_0000; Hypervisor.framework answers these accesses itself, with no exit. Then the trapped devices, which are deliberately left unmapped so that every access exits to macvmm: 0x0900_0000 the PL011 UART, the serial console; 0x0901_0000 the PL031 RTC, the clock; 0x0a00_0000 the virtio-mmio slots, 32 of them 0x200 bytes apart. Unused holes follow, also unmapped. 0x4000_0000: RAM, 512 MiB by default, mapped, so the guest reads and writes it with no exit.</desc>
<style>
.dg .dg-node{fill: #FFFDF8; stroke: #1E2227; stroke-width: 1.25;}
.dg .dg-decision{fill: #F6E9DC; stroke: #A33F00;}
.dg .dg-end{fill: #F3EEE2;}
.dg .dg-note{fill: #F6E9DC; stroke: #A33F00;}
.dg .dg-edge{stroke: #5B616B; stroke-width: 1.5; fill: none;}
.dg .dg-life{stroke: #5B616B; stroke-width: 1;}
.dg .dg-arrow{fill: #5B616B;}
.dg .dg-text{fill: #1E2227;}
.dg .dg-label{fill: #5B616B;}
.dg .dg-label-bg{fill: #FFFDF8;}
.dg .dg-accent{fill: #F6E9DC; stroke: #A33F00; stroke-width: 1.75;}
.dg .dg-muted{fill: none; stroke: #5B616B; stroke-dasharray: 5 4;}
.dg .dg-group{fill: #F3EEE2; stroke: #E4DDCC;}
.dg .dg-group-label{fill: #A33F00; font-weight: 600;}
.dg .dg-mono{font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.dg .dg-bg{fill: #FFFDF8}
@media (prefers-color-scheme: dark) {
.dg .dg-node{fill: #141820; stroke: #E7E2D7; stroke-width: 1.25;}
.dg .dg-decision{fill: #231A14; stroke: #F0A15E;}
.dg .dg-end{fill: #0B0E13;}
.dg .dg-note{fill: #231A14; stroke: #F0A15E;}
.dg .dg-edge{stroke: #9AA0A8; stroke-width: 1.5; fill: none;}
.dg .dg-life{stroke: #9AA0A8; stroke-width: 1;}
.dg .dg-arrow{fill: #9AA0A8;}
.dg .dg-text{fill: #E7E2D7;}
.dg .dg-label{fill: #9AA0A8;}
.dg .dg-label-bg{fill: #141820;}
.dg .dg-accent{fill: #231A14; stroke: #F0A15E; stroke-width: 1.75;}
.dg .dg-muted{fill: none; stroke: #9AA0A8; stroke-dasharray: 5 4;}
.dg .dg-group{fill: #0B0E13; stroke: #262B33;}
.dg .dg-group-label{fill: #F0A15E; font-weight: 600;}
.dg .dg-mono{font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
.dg .dg-bg{fill: #141820}
}
</style>
<defs><marker id="memory-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect class="dg-bg" x="0" y="0" width="336" height="640" rx="10" fill="#FFFDF8"/>
<rect class="dg-group" x="110" y="206" width="224" height="270" rx="10" fill="none" stroke="currentColor"/><text class="dg-text dg-group-label" x="122" y="228" font-size="14" text-anchor="start" fill="currentColor">Trapped: every access</text><text class="dg-text dg-group-label" x="122" y="246.2" font-size="14" text-anchor="start" fill="currentColor">exits to macvmm</text><text class="dg-text dg-mono" x="103" y="25.3" font-size="15" text-anchor="end" fill="currentColor">0x0000_0000</text><rect class="dg-node" x="118" y="8" width="208" height="80" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="222" y="33.1" font-size="15" text-anchor="middle" fill="currentColor">Flash</text><text class="dg-text dg-label" x="222" y="55.6" font-size="14" text-anchor="middle" fill="currentColor">firmware code,</text><text class="dg-text dg-label" x="222" y="73.8" font-size="14" text-anchor="middle" fill="currentColor">mapped only with --bios</text><text class="dg-text dg-mono" x="103" y="115.3" font-size="15" text-anchor="end" fill="currentColor">0x0800_0000</text><rect class="dg-node" x="118" y="98" width="208" height="98" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="222" y="132.1" font-size="15" text-anchor="middle" fill="currentColor">GIC</text><text class="dg-text dg-label" x="222" y="154.6" font-size="14" text-anchor="middle" fill="currentColor">interrupt controller.</text><text class="dg-text dg-label" x="222" y="172.8" font-size="14" text-anchor="middle" fill="currentColor">Handled in HVF: no exit</text><text class="dg-text dg-mono" x="103" y="275.3" font-size="15" text-anchor="end" fill="currentColor">0x0900_0000</text><rect class="dg-node" x="118" y="258" width="208" height="62" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="222" y="283.2" font-size="15" text-anchor="middle" fill="currentColor">PL011 UART</text><text class="dg-text dg-label" x="222" y="305.7" font-size="14" text-anchor="middle" fill="currentColor">the serial console</text><text class="dg-text dg-mono" x="103" y="347.3" font-size="15" text-anchor="end" fill="currentColor">0x0901_0000</text><rect class="dg-node" x="118" y="330" width="208" height="62" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="222" y="355.2" font-size="15" text-anchor="middle" fill="currentColor">PL031 RTC</text><text class="dg-text dg-label" x="222" y="377.7" font-size="14" text-anchor="middle" fill="currentColor">the clock</text><text class="dg-text dg-mono" x="103" y="419.3" font-size="15" text-anchor="end" fill="currentColor">0x0a00_0000</text><rect class="dg-node" x="118" y="402" width="208" height="62" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="222" y="427.2" font-size="15" text-anchor="middle" fill="currentColor">virtio-mmio</text><text class="dg-text dg-label" x="222" y="449.7" font-size="14" text-anchor="middle" fill="currentColor">32 slots, 0x200 apart</text><text class="dg-text dg-label" x="222" y="497.8" font-size="14" text-anchor="middle" fill="currentColor">unused holes, also</text><text class="dg-text dg-label" x="222" y="516" font-size="14" text-anchor="middle" fill="currentColor">unmapped</text><text class="dg-text dg-mono" x="103" y="547.3" font-size="15" text-anchor="end" fill="currentColor">0x4000_0000</text><rect class="dg-node dg-accent" x="118" y="530" width="208" height="98" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="222" y="555" font-size="15" text-anchor="middle" fill="currentColor">RAM</text><text class="dg-text dg-label" x="222" y="577.5" font-size="14" text-anchor="middle" fill="currentColor">512 MiB by default.</text><text class="dg-text dg-label" x="222" y="595.7" font-size="14" text-anchor="middle" fill="currentColor">Mapped, so accesses</text><text class="dg-text dg-label" x="222" y="613.9" font-size="14" text-anchor="middle" fill="currentColor">never exit.</text>
</svg>
