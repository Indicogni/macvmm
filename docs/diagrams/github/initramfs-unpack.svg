y="133.6" width="148.3" height="54.7" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="130" y="148.6" font-size="13" text-anchor="middle" fill="currentColor">the character 0, at</text><text class="dg-text dg-label" x="130" y="165.5" font-size="13" text-anchor="middle" fill="currentColor">a multiple of 4: a</text><text class="dg-text dg-label" x="130" y="182.4" font-size="13" text-anchor="middle" fill="currentColor">raw newc member</text><rect class="dg-label-bg" x="295" y="132.1" width="90.1" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="340" y="147.1" font-size="13" text-anchor="middle" fill="currentColor">a zero byte</text><rect class="dg-label-bg" x="477.7" y="142.3" width="104.6" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="530" y="157.3" font-size="13" text-anchor="middle" fill="currentColor">anything else</text><rect class="dg-label-bg" x="134" y="284.1" width="119.2" height="20.9" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="139" y="299.1" font-size="13" text-anchor="start" fill="currentColor">TRAILER!!! seen</text><rect class="dg-label-bg" x="399.5" y="290.7" width="126.5" height="54.7" rx="3" fill="none" stroke="none"/><text class="dg-text dg-label" x="521" y="305.7" font-size="13" text-anchor="end" fill="currentColor">decompressed</text><text class="dg-text dg-label" x="521" y="322.6" font-size="13" text-anchor="end" fill="currentColor">stream is parsed</text><text class="dg-text dg-label" x="521" y="339.5" font-size="13" text-anchor="end" fill="currentColor">as newc</text>
</svg>
