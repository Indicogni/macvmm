<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 506" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>The heart of a VMM: run, exit, emulate, resume</title>
<desc>A loop of five steps. 1. macvmm calls hv_vcpu_run and the guest runs at full speed. 2. Exit: the guest touched a device address or made a hypercall, so the CPU stops it and hv_vcpu_run returns. 3. macvmm decodes the syndrome register, ESR_EL2, which says why the guest stopped. 4. A device model, or the PSCI code for a hypercall, emulates the access. 5. macvmm advances the program counter to the next instruction (after a hypercall the CPU has already done this), then calls hv_vcpu_run again. Measured on 2026-11-22 on an Apple M5 Pro with scripts/run-linux.sh --cpus 4 --stats, booting Linux to a shell and powering it off: 35,271 exits in total, the same in each of 4 runs. 35,235 were device accesses (MMIO data aborts), 25 were hypercalls and 11 were other kinds. There were no timer or WFI exits, because the in-kernel GIC handles those inside Hypervisor.framework.</desc>
<defs><marker id="exit-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<path class="dg-edge" d="M248 48L290 48L290 120" fill="none" stroke="currentColor" marker-end="url(#exit-loop-arrow)"/><path class="dg-edge" d="M254 200L254 244" fill="none" stroke="currentColor" marker-end="url(#exit-loop-arrow)"/><path class="dg-edge" d="M180 284L156 284" fill="none" stroke="currentColor" marker-end="url(#exit-loop-arrow)"/><path class="dg-edge" d="M82 244L82 200" fill="none" stroke="currentColor" marker-end="url(#exit-loop-arrow)"/><path class="dg-edge" d="M46 120L46 48L88 48" fill="none" stroke="currentColor" marker-end="url(#exit-loop-arrow)"/><rect class="dg-node dg-accent" x="88" y="8" width="160" height="80" rx="6" fill="none" stroke="currentColor"/><text class="dg-text dg-mono" x="168" y="33.1" font-size="15" text-anchor="middle" fill="currentColor">hv_vcpu_run</text><text class="dg-text dg-label" x="168" y="55.6" font-size="14" text-anchor="middle" fill="currentColor">the guest runs at</text><text class="dg-text dg-label" x="168" y="73.8" font-size="14" text-anchor="middle" fill="currentColor">full speed</text><rect class="dg-node" x="180" y="120" width="148" height="80" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="254" y="145.1" font-size="15" text-anchor="middle" fill="currentColor">Exit</text><text class="dg-text dg-label" x="254" y="167.6" font-size="14" text-anchor="middle" fill="currentColor">device access</text><text class="dg-text dg-label" x="254" y="185.8" font-size="14" text-anchor="middle" fill="currentColor">or hypercall</text><rect class="dg-node" x="180" y="244" width="148" height="80" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="254" y="278.2" font-size="15" text-anchor="middle" fill="currentColor">Decode the ESR</text><text class="dg-text dg-label" x="254" y="300.7" font-size="14" text-anchor="middle" fill="currentColor">why it stopped</text><rect class="dg-node" x="8" y="244" width="148" height="80" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="82" y="269.1" font-size="15" text-anchor="middle" fill="currentColor">Emulate</text><text class="dg-text dg-label" x="82" y="291.6" font-size="14" text-anchor="middle" fill="currentColor">a device model</text><text class="dg-text dg-label" x="82" y="309.8" font-size="14" text-anchor="middle" fill="currentColor">or PSCI answers</text><rect class="dg-node" x="8" y="120" width="148" height="80" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="82" y="145.1" font-size="15" text-anchor="middle" fill="currentColor">Advance the PC</text><text class="dg-text dg-label" x="82" y="167.6" font-size="14" text-anchor="middle" fill="currentColor">to the next</text><text class="dg-text dg-label" x="82" y="185.8" font-size="14" text-anchor="middle" fill="currentColor">instruction</text><rect class="dg-node dg-end" x="8" y="356.8" width="320" height="134.5" rx="14" fill="none" stroke="currentColor"/><text class="dg-text" x="20" y="381.8" font-size="15" text-anchor="start" fill="currentColor">Measured: one Linux run, 4 vCPUs</text><text class="dg-text dg-label" x="20" y="404.3" font-size="14" text-anchor="start" fill="currentColor">35,271 exits in total.</text><text class="dg-text dg-label" x="20" y="422.5" font-size="14" text-anchor="start" fill="currentColor">35,235 were device accesses (MMIO),</text><text class="dg-text dg-label" x="20" y="440.7" font-size="14" text-anchor="start" fill="currentColor">25 were hypercalls, 11 other kinds.</text><text class="dg-text dg-label" x="20" y="458.9" font-size="14" text-anchor="start" fill="currentColor">No timer or WFI exits at all:</text><text class="dg-text dg-label" x="20" y="477.1" font-size="14" text-anchor="start" fill="currentColor">the in-kernel GIC handles those.</text>
</svg>
