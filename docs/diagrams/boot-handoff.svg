<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 351" class="dg" font-family="system-ui, -apple-system, sans-serif">
<title>The arm64 boot hand-off</title>
<desc>Sequence between the VMM acting as boot loader on the host, guest RAM, and vCPU 0. 1. The VMM writes the DTB, the kernel Image and the initramfs into guest RAM. 2. The VMM sets registers x0 to x3, CPSR and the PC of vCPU 0. Note on vCPU 0: the MMU is off and interrupts (DAIF) are masked. 3. The VMM runs the vCPU. 4. The vCPU fetches the kernel's first instruction from guest RAM.</desc>
<defs><marker id="boot-handoff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect class="dg-node" x="24" y="14" width="164" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="106" y="37" font-size="14" text-anchor="middle" fill="currentColor">VMM (boot loader,</text><text class="dg-text" x="106" y="55.2" font-size="14" text-anchor="middle" fill="currentColor">host)</text><line class="dg-life" x1="106" y1="68.4" x2="106" y2="346.7" stroke="currentColor" stroke-dasharray="3 4"/><rect class="dg-node" x="204" y="14" width="164" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="286" y="46.1" font-size="14" text-anchor="middle" fill="currentColor">Guest RAM</text><line class="dg-life" x1="286" y1="68.4" x2="286" y2="346.7" stroke="currentColor" stroke-dasharray="3 4"/><rect class="dg-node" x="384" y="14" width="164" height="54.4" rx="6" fill="none" stroke="currentColor"/><text class="dg-text" x="466" y="46.1" font-size="14" text-anchor="middle" fill="currentColor">vCPU 0</text><line class="dg-life" x1="466" y1="68.4" x2="466" y2="346.7" stroke="currentColor" stroke-dasharray="3 4"/><text class="dg-text" x="196" y="99.4" font-size="13" text-anchor="middle" fill="currentColor">writes DTB, Image,</text><text class="dg-text" x="196" y="116.3" font-size="13" text-anchor="middle" fill="currentColor">initramfs</text><line class="dg-edge" x1="106" y1="126.2" x2="284" y2="126.2" stroke="currentColor" marker-end="url(#boot-handoff-arrow)"/><rect class="dg-label-bg" x="205.6" y="146.2" width="160.9" height="18.9" rx="3" fill="none" stroke="none"/><text class="dg-text" x="286" y="161.2" font-size="13" text-anchor="middle" fill="currentColor">sets x0..x3, CPSR, PC</text><line class="dg-edge" x1="106" y1="171.1" x2="464" y2="171.1" stroke="currentColor" marker-end="url(#boot-handoff-arrow)"/><rect class="dg-note" x="383.2" y="193.1" width="165.6" height="28.9" rx="4" fill="none" stroke="currentColor"/><text class="dg-text" x="466" y="212.1" font-size="13" text-anchor="middle" fill="currentColor">MMU off, DAIF masked</text><rect class="dg-label-bg" x="267.4" y="236" width="37.1" height="18.9" rx="3" fill="none" stroke="none"/><text class="dg-text" x="286" y="251" font-size="13" text-anchor="middle" fill="currentColor">runs</text><line class="dg-edge" x1="106" y1="260.9" x2="464" y2="260.9" stroke="currentColor" marker-end="url(#boot-handoff-arrow)"/><text class="dg-text" x="376" y="295.9" font-size="13" text-anchor="middle" fill="currentColor">kernel fetches its</text><text class="dg-text" x="376" y="312.8" font-size="13" text-anchor="middle" fill="currentColor">first instruction</text><line class="dg-edge" x1="466" y1="322.7" x2="288" y2="322.7" stroke="currentColor" marker-end="url(#boot-handoff-arrow)"/>
</svg>
