# Checkpoint 13 `loaders`: the arm64 Image header, the boot plan, the zboot refusal, and ELF.
id = "13"
slug = "loaders"
requires = ["12"]

# The hostile Image corpus, the hostile ELF corpus, and the boot plan with its 10,000-case
# property test. Host only: no Hypervisor.framework call.
[contract]
tests = ["contract/image_hostile.rs", "contract/elf_hostile.rs", "contract/bootplan.rs"]

# (a) Chapter 03's hello guest, loaded from its ELF file instead of the flat binary.
[[run]]
name = "hello-elf"
guest = "hello"
args = ["run", "--mem", "64M", "--kernel", "{guest}", "--timeout", "10"]
expect_exit_code = 0
serial = "expected/hello-elf.txt"

# (b) The boot plan for Alpine's Image, printed by a binary signed WITHOUT the hypervisor
# entitlement: it can only succeed if the dry run never creates a VM.
# Needs `scripts/fetch.sh linux` (the files in .cache/macvmm/).
[[run]]
name = "dry-run"
args = ["run", "--dry-run", "--kernel", "{repo}/.cache/macvmm/Image-virt", "--initrd", "{repo}/.cache/macvmm/initramfs-test.img", "--mem", "512M"]
sign = "no-entitlements"
timeout = 30
expect_exit_code = 0
serial = "expected/dry-run.txt"

# (c) Alpine's kernel as downloaded: an EFI zboot wrapper, refused by name (exit 2).
[[run]]
name = "zboot"
args = ["run", "--kernel", "{repo}/.cache/macvmm/vmlinuz-virt", "--timeout", "10"]
expect_exit_code = 2
serial = "expected/zboot.txt"

[journal]
file = "journal/13.md"
questions = 4
predict = true

[hints]
conceptual = "Loading is a contract, not a copy: the Image header says where the kernel sits (text_offset above a 2 MiB base) and how much memory it uses (image_size, more than the file); plan every range first, check it against RAM with checked arithmetic, then copy."
spec = "Linux Documentation/arch/arm64/booting.rst section 4 (the 64-byte header, placement, the 1 GiB window, x0..x3, MMU off); the System V gABI ELF Header and Program Header chapters for the ELF rules."
pseudocode = "parse_header: len >= 64, magic at 0x38, flags bit 0 = 0, page size != 3, image_size != 0, text_offset % 4096 == 0, file <= image_size; place: load = 0x40200000 + text_offset, end = load.checked_add(image_size), ram.contains(load, image_size); initrd at align_up(end, 2 MiB), then the window check."
anchor = "crates/vmm/src/loader/image.rs (parse_header, place), loader/initrd.rs (place, check_window), loader/plan.rs (plan), loader/elf.rs (parse, load)."
