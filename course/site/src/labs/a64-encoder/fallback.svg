<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" fill="none" stroke="currentColor" font-family="ui-monospace, Menlo, Consolas, monospace">
<title>Bit fields of chapter 02's three instruction words</title>
<desc>Three 32-bit words with every field labelled. movz x0, #0x2a is 0xD2800540: sf 1, opc 10, fixed 100101, hw 00, imm16 0000000000101010, Rd 00000. hvc #0 is 0xD4000002: fixed 11010100, opc 000, imm16 all zero, fixed 000, LL 10. b . is 0x14000000: op 0, fixed 00101, imm26 all zero (offset 0, branch to itself). In memory the first word is stored little-endian as the bytes 40 05 80 d2.</desc>
<text x="40" y="30" fill="currentColor" stroke="none" font-size="14" font-weight="700">Fixed fields say which instruction it is; the others carry operands.</text>
<text x="40" y="70" fill="currentColor" stroke="none" font-size="14" font-weight="700">movz x0, #0x2a  =  0xD2800540</text>
<rect x="40" y="80" width="20" height="56" stroke-width="1.5"/>
<text x="50" y="98" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">sf</text>
<text x="50" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">1</text>
<text x="50" y="131" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">31</text>
<rect x="60" y="80" width="40" height="56" stroke-width="1.5"/>
<text x="80" y="98" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">opc</text>
<text x="80" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">10</text>
<text x="80" y="131" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">30..29</text>
<rect x="100" y="80" width="120" height="56" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="160" y="98" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">fixed</text>
<text x="160" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">100101</text>
<text x="160" y="131" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">28..23</text>
<rect x="220" y="80" width="40" height="56" stroke-width="1.5"/>
<text x="240" y="98" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">hw</text>
<text x="240" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">00</text>
<text x="240" y="131" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">22..21</text>
<rect x="260" y="80" width="320" height="56" stroke-width="1.5"/>
<text x="420" y="98" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">imm16</text>
<text x="420" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">0000000000101010</text>
<text x="420" y="131" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">20..5</text>
<rect x="580" y="80" width="100" height="56" stroke-width="1.5"/>
<text x="630" y="98" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">Rd</text>
<text x="630" y="116" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">00000</text>
<text x="630" y="131" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">4..0</text>
<text x="40" y="190" fill="currentColor" stroke="none" font-size="14" font-weight="700">hvc #0  =  0xD4000002</text>
<rect x="40" y="200" width="160" height="56" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="120" y="218" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">fixed</text>
<text x="120" y="236" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">11010100</text>
<text x="120" y="251" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">31..24</text>
<rect x="200" y="200" width="60" height="56" stroke-width="1.5"/>
<text x="230" y="218" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">opc</text>
<text x="230" y="236" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">000</text>
<text x="230" y="251" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">23..21</text>
<rect x="260" y="200" width="320" height="56" stroke-width="1.5"/>
<text x="420" y="218" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">imm16</text>
<text x="420" y="236" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">0000000000000000</text>
<text x="420" y="251" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">20..5</text>
<rect x="580" y="200" width="60" height="56" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="610" y="218" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">fixed</text>
<text x="610" y="236" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">000</text>
<text x="610" y="251" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">4..2</text>
<rect x="640" y="200" width="40" height="56" stroke-width="1.5"/>
<text x="660" y="218" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">LL</text>
<text x="660" y="236" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">10</text>
<text x="660" y="251" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">1..0</text>
<text x="40" y="310" fill="currentColor" stroke="none" font-size="14" font-weight="700">b .  =  0x14000000</text>
<rect x="40" y="320" width="20" height="56" stroke-width="1.5"/>
<text x="50" y="338" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">op</text>
<text x="50" y="356" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">0</text>
<text x="50" y="371" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">31</text>
<rect x="60" y="320" width="100" height="56" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="110" y="338" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">fixed</text>
<text x="110" y="356" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">00101</text>
<text x="110" y="371" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">30..26</text>
<rect x="160" y="320" width="520" height="56" stroke-width="1.5"/>
<text x="420" y="338" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">imm26</text>
<text x="420" y="356" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" letter-spacing="0">00000000000000000000000000</text>
<text x="420" y="371" text-anchor="middle" fill="currentColor" stroke="none" font-size="10">25..0</text>
</svg>
