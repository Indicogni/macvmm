<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-labelledby="rcl-fb-t rcl-fb-d" font-family="ui-monospace, Menlo, monospace" font-size="11">
<title id="rcl-fb-t">Layout of hv_vcpu_exit_t, 32 bytes</title>
<desc id="rcl-fb-d">Four rows of 8 bytes. Row 0x00: reason, a 32-bit value in bytes 0 to 3, then 4 bytes of padding in bytes 4 to 7. Row 0x08: exception.syndrome, 64 bits. Row 0x10: exception.virtual_address, 64 bits. Row 0x18: exception.physical_address, 64 bits. Offsets 0, 8, 16 and 24; 32 bytes in all.</desc>
<defs><pattern id="rcl-fb-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.5" opacity="0.45"/></pattern></defs>
<text x="0" y="20" fill="currentColor" font-size="12" font-weight="700">hv_vcpu_exit_t: offsets 0, 8, 16, 24; size 32</text>
<text x="0" y="62" fill="currentColor">0x00</text>
<text x="0" y="102" fill="currentColor">0x08</text>
<text x="0" y="142" fill="currentColor">0x10</text>
<text x="0" y="182" fill="currentColor">0x18</text>
<rect x="56" y="40" width="172" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="62" y="60" fill="currentColor">reason (u32)</text>
<rect x="232" y="40" width="172" height="32" rx="3" fill="url(#rcl-fb-hatch)" stroke="currentColor" stroke-dasharray="4 3"/>
<text x="318.0" y="60" fill="currentColor" text-anchor="middle">pad</text>
<rect x="56" y="80" width="348" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="62" y="100" fill="currentColor">exception.syndrome (u64)</text>
<rect x="56" y="120" width="348" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="62" y="140" fill="currentColor">exception.virtual_address (u64)</text>
<rect x="56" y="160" width="348" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="62" y="180" fill="currentColor">exception.physical_address (u64)</text>
<text x="0" y="222" fill="currentColor">C puts 4 bytes of padding after reason so that</text>
<text x="0" y="238" fill="currentColor">the next 64-bit field starts at a multiple of 8.</text>
</svg>
