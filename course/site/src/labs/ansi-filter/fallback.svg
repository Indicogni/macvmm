<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="af-fb-title af-fb-desc">
  <title id="af-fb-title">Guest bytes through macvmm's safe filter</title>
  <desc id="af-fb-desc">Four inputs and what the safe policy writes. ESC [ 1 ; 3 1 m hi ESC [ 0 m passes unchanged: two SGR sequences with small numeric parameters. ESC ] 0 ; rm -rf ~ BEL ok becomes ok: the whole OSC title string is dropped, up to and including its BEL. before ESC [ 6 n after becomes before, two spaces, after: the cursor position query is dropped, so the terminal never types a reply. A lone byte 0x9B followed by 6n becomes the plain text 6n: the 8-bit CSI byte is dropped on its own, and what follows is text.</desc>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="currentColor">
    <text x="20" y="30" font-weight="700">guest writes</text>
    <text x="380" y="30" font-weight="700">safe writes</text>
    <text x="20" y="70">\x1b[1;31mhi\x1b[0m</text>
    <text x="380" y="70">\x1b[1;31mhi\x1b[0m</text>
    <text x="380" y="86" font-size="11">kept: SGR (colour) is allowed</text>
    <text x="20" y="120">\x1b]0;rm -rf ~\x07ok</text>
    <text x="380" y="120">ok</text>
    <text x="380" y="136" font-size="11">dropped: OSC title, whole string</text>
    <text x="20" y="170">before \x1b[6n after</text>
    <text x="380" y="170">before  after</text>
    <text x="380" y="186" font-size="11">dropped: a query (cursor position)</text>
    <text x="20" y="220">\x9b6n</text>
    <text x="380" y="220">6n</text>
    <text x="380" y="236" font-size="11">dropped: raw 8-bit CSI byte</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M300 66 L360 66 M352 61 L360 66 L352 71"/>
    <path d="M300 116 L360 116 M352 111 L360 116 L352 121"/>
    <path d="M300 166 L360 166 M352 161 L360 166 L352 171"/>
    <path d="M300 216 L360 216 M352 211 L360 216 L352 221"/>
  </g>
</svg>
