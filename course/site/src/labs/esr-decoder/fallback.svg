<svg viewBox="0 0 632 156" width="100%" role="img" fill="currentColor" font-family="system-ui, sans-serif">
<title>ESR_EL2 0x93890046 split into its fields</title>
<desc>The syndrome from chapter 05's stop, 0x93890046, as 32 bits. EC (bits 31 to 26) is 100100, 0x24, a data abort from a lower EL. IL (bit 25) is 1. ISV (bit 24) is 1, so the access is described. SAS (bits 23 to 22) is 10: 4 bytes. SSE (bit 21) is 0. SRT (bits 20 to 16) is 01001: register 9. SF (bit 15) is 0: a 32-bit w register. WnR (bit 6) is 1: a write. DFSC (bits 5 to 0) is 000110: translation fault, level 2. So the guest stored 4 bytes from w9. Dashed boxes are bits macvmm does not use.</desc>
<text x="12" y="18" font-size="14" font-family="ui-monospace, monospace">ESR_EL2 = 0x9389_0046</text>
<rect x="12" y="46" width="114" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="69" y="40" text-anchor="middle" font-size="10">EC</text>
<text x="69" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">100100</text>
<rect x="126" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="135.5" y="40" text-anchor="middle" font-size="10">IL</text>
<text x="135.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">1</text>
<rect x="145" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="154.5" y="40" text-anchor="middle" font-size="10">ISV</text>
<text x="154.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">1</text>
<rect x="164" y="46" width="38" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="183" y="40" text-anchor="middle" font-size="10">SAS</text>
<text x="183" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">10</text>
<rect x="202" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="211.5" y="40" text-anchor="middle" font-size="10">SSE</text>
<text x="211.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">0</text>
<rect x="221" y="46" width="95" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="268.5" y="40" text-anchor="middle" font-size="10">SRT</text>
<text x="268.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">01001</text>
<rect x="316" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="325.5" y="40" text-anchor="middle" font-size="10">SF</text>
<text x="325.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">0</text>
<rect x="335" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="344.5" y="40" text-anchor="middle" font-size="10">AR</text>
<text x="344.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">0</text>
<rect x="354" y="46" width="57" height="34" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/>
<text x="382.5" y="40" text-anchor="middle" font-size="10">13:11</text>
<text x="382.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">000</text>
<rect x="411" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="420.5" y="40" text-anchor="middle" font-size="10">FnV</text>
<text x="420.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">0</text>
<rect x="430" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/>
<text x="439.5" y="40" text-anchor="middle" font-size="10">EA</text>
<text x="439.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">0</text>
<rect x="449" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/>
<text x="458.5" y="40" text-anchor="middle" font-size="10">CM</text>
<text x="458.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">0</text>
<rect x="468" y="46" width="19" height="34" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="477.5" y="40" text-anchor="middle" font-size="10">S1P</text>
<text x="477.5" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">0</text>
