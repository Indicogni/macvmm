<text x="306.5" y="93" text-anchor="middle" font-size="9">16</text>
<text x="325.5" y="93" text-anchor="middle" font-size="9">15</text>
<text x="496.5" y="93" text-anchor="middle" font-size="9">6</text>
<text x="610.5" y="93" text-anchor="middle" font-size="9">0</text>
<text x="12" y="114" font-size="10.5">Data abort from a lower EL (EC 0x24). Write of 4 bytes from w9. Translation fault, level 2 (DFSC 0b000110).</text>
<text x="12" y="130" font-size="10">Dashed boxes: bits macvmm does not use. With JavaScript on, this is an interactive decoder.</text>
</svg>
