<text x="563" y="40" text-anchor="middle" font-size="10">DFSC</text>
<text x="563" y="68" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace">000110</text>
<text x="21.5" y="93" text-anchor="middle" font-size="9">31</text>
<text x="116.5" y="93" text-anchor="middle" font-size="9">26</text>
<text x="135.5" y="93" text-anchor="middle" font-size="9">25</text>
