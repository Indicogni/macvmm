<svg viewBox="0 0 720 174" width="100%" fill="currentColor" font-family="system-ui, sans-serif">
<title>Boot timeline: the healthy boot against a boot with no timer node</title>
<desc>Exit density over time for two real runs of chapter 14's Linux boot, one strip each, each on its own time scale; the long silence of the second run is squeezed into a dashed box. Healthy boot: 32,829 exits over 218.69 ms; last stage reached 8, user space. The guest called PSCI SYSTEM_OFF: a clean power-off, exit status 0. No /timer node: 14,163 exits over 9.96 s; last stage reached 4, time. The kernel says: no matching timers found, Unable to initialise architected timer, panic. After 9.90 s with no exits at all, the run ended with a canceled exit: something outside the guest stopped it (exit status 5 for --timeout, 130 for SIGINT, SIGTERM or Ctrl-A x).</desc>
