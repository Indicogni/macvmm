<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="litmus-fb-title litmus-fb-desc">
  <title id="litmus-fb-title">The store-buffering test with both stores still queued</title>
  <desc id="litmus-fb-desc">Thread A runs X.store(1) and Thread B runs Y.store(1), but each store waits in its own core's store buffer. Then A loads Y and B loads X straight from shared memory, where both are still 0, so both threads read 0. Interleaving on paper can never give that outcome; arm64 and x86-64 both allow it, and only a fence(SeqCst) between the store and the load in both threads forbids it.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="10" y="10" width="150" height="70" rx="6"/>
    <rect x="200" y="10" width="150" height="70" rx="6"/>
    <rect x="20" y="96" width="130" height="28" rx="4" stroke-dasharray="5 3"/>
    <rect x="210" y="96" width="130" height="28" rx="4" stroke-dasharray="5 3"/>
    <rect x="60" y="160" width="240" height="44" rx="6"/>
    <line x1="85" y1="80" x2="85" y2="96"/>
    <line x1="275" y1="80" x2="275" y2="96"/>
    <line x1="130" y1="60" x2="150" y2="160" stroke-dasharray="2 3"/>
    <line x1="230" y1="60" x2="210" y2="160" stroke-dasharray="2 3"/>
  </g>
  <g fill="currentColor" font-family="sans-serif" font-size="11">
    <text x="20" y="28" font-weight="bold">Thread A</text>
    <text x="20" y="46" font-family="monospace">X.store(1)</text>
    <text x="20" y="64" font-family="monospace">r1 = Y.load() → 0</text>
    <text x="210" y="28" font-weight="bold">Thread B</text>
    <text x="210" y="46" font-family="monospace">Y.store(1)</text>
    <text x="210" y="64" font-family="monospace">r2 = X.load() → 0</text>
    <text x="28" y="114">buffer: X = 1 (queued)</text>
    <text x="218" y="114">buffer: Y = 1 (queued)</text>
    <text x="72" y="178">shared memory: X = 0, Y = 0</text>
    <text x="72" y="196">both loads read here: r1 = 0, r2 = 0</text>
  </g>
</svg>
