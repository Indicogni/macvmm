<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="dl-fb-title dl-fb-desc">
  <title id="dl-fb-title">The durability ladder</title>
  <desc id="dl-fb-desc">Five rungs between a guest write() and storage that survives: 1, the guest page cache in guest RAM; 2, a request in flight in the VMM; 3, the host page cache owned by macOS; 4, the SSD's volatile cache; 5, flash. A guest kernel crash wipes rung 1. Killing the VMM process wipes rungs 1 and 2. A macOS crash wipes rungs 1 to 3. A power cut wipes rungs 1 to 4. The virtio OUT request moves data past rung 1, pwrite past rung 2, fsync past rung 3, and only F_FULLFSYNC past rung 4, which is why the VMM must answer the guest's FLUSH with F_FULLFSYNC.</desc>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="currentColor">
    <text x="20" y="22" font-weight="700">rung</text>
    <text x="350" y="22" font-weight="700">wiped by</text>
    <text x="24" y="56">1 guest page cache</text>
    <text x="24" y="116">2 request in flight in the VMM</text>
    <text x="24" y="176">3 host page cache (macOS)</text>
    <text x="24" y="236">4 SSD's volatile cache</text>
    <text x="24" y="296">5 flash: survives</text>
    <text x="40" y="84" font-size="11">virtio OUT request</text>
    <text x="40" y="144" font-size="11">pwrite() returns</text>
    <text x="40" y="204" font-size="11">fsync()</text>
    <text x="40" y="264" font-size="11">F_FULLFSYNC</text>
    <text x="356" y="56" font-size="12">guest crash, kill -9, macOS crash, power</text>
    <text x="356" y="116" font-size="12">kill -9, macOS crash, power</text>
    <text x="356" y="176" font-size="12">macOS crash, power</text>
    <text x="356" y="236" font-size="12">power</text>
    <text x="356" y="296" font-size="12">nothing</text>
    <text x="520" y="86" font-size="10">guest above, host below</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="16" y="38" width="320" height="26" rx="4"/>
    <rect x="16" y="98" width="320" height="26" rx="4"/>
    <rect x="16" y="158" width="320" height="26" rx="4"/>
    <rect x="16" y="218" width="320" height="26" rx="4"/>
    <rect x="16" y="278" width="320" height="26" rx="4" stroke-width="3"/>
    <path d="M30 64 L30 96"/><path d="M25 89 L30 96 L35 89"/>
    <path d="M30 124 L30 156"/><path d="M25 149 L30 156 L35 149"/>
    <path d="M30 184 L30 216"/><path d="M25 209 L30 216 L35 209"/>
    <path d="M30 244 L30 276"/><path d="M25 269 L30 276 L35 269"/>
    <path d="M16 90 L664 90" stroke-dasharray="6 4"/>
  </g>
</svg>
