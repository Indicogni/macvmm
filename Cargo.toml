# ANCHOR: workspace_manifest
[workspace]
resolver = "3"
members = ["crates/hvf", "crates/vmm", "crates/macvmm", "crates/xtask", "crates/fuzz"]
# A plain `cargo build` (no `-p`, no `--workspace`) builds these only. `crates/fuzz` is left out
# because it depends on `vmm` with `test-util`, and Cargo unifies features across the packages of
# one build: with it, the shipped `macvmm` would link the FDT reader and the test doubles
# (threat model FDT-1, RR14). `--workspace` (scripts/check.sh) and `-p fuzz` still build it.
default-members = ["crates/hvf", "crates/vmm", "crates/macvmm", "crates/xtask"]
# Separate build worlds: bare-metal guests (own workspace, aarch64-unknown-none), throwaway spikes,
# and the Swift companion tool.
exclude = ["guests", "spikes", "tools"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
# Decision D22: code is dual-licensed (LICENSE-MIT, LICENSE-APACHE); course text is CC BY 4.0
# (course/LICENSE). `publish = false` stays: the crates are read from this repository, not crates.io.
license = "MIT OR Apache-2.0"
repository = "https://github.com/Indicogni/macvmm"

# RUST-2 (threat model §7.0): an arithmetic overflow we missed must become a clean stop, not a
# silently wrong guest address. `panic = "unwind"` lets the VMM restore the terminal on a panic.
[profile.release]
overflow-checks = true
panic = "unwind"
# ANCHOR_END: workspace_manifest
